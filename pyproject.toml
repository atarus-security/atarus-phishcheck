[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atarus-phishcheck"
version = "0.2.0"
description = "Defensive email security analyzer. Parse headers, check SPF/DKIM/DMARC, extract IOCs, score phishing likelihood."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Atarus Offensive Security", email = "info@atarussecurity.com"},
]
keywords = ["phishing", "email-security", "infosec", "dfir", "pentesting"]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "dnspython>=2.4",
    "requests>=2.31",
    "jinja2>=3.1",
    "weasyprint>=60.0",
    "python-dateutil>=2.8",
]

[project.scripts]
atarus-phishcheck = "atarus_phishcheck.cli:main"

[project.urls]
Homepage = "https://github.com/atarus-security/atarus-phishcheck"
Repository = "https://github.com/atarus-security/atarus-phishcheck"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atarus_phishcheck = ["templates/*.html"]
